services:
    - type: web
      name: total_66
      env: docker
      plan: free
      region: oregon
      buildCommand: docker build -t total_66 .
      startCommand: /app/bin/migrate && /app/bin/server
      healthCheckPath: /
      envVars:
          - key: DATABASE_URL
            fromDatabase:
                name: total_66_db
                property: connectionString
          - key: SECRET_KEY_BASE
            generateValue: true
          - key: POOL_SIZE
            value: '10'

databases:
    - name: total_66_db
      plan: free
      region: oregon
      ipAllowList: [] # Access from anywhere (for now, or restrict if needed)

# Enable Preview Environments for Pull Requests
previews:
    - generation: automatic # Automatically deploy on every PR
      ttl: 30d # Time to live for preview environments
      envVars:
          - key: SECRET_KEY_BASE
            generateValue: true
